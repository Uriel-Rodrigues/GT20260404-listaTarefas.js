<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lista de tarefas</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
     <script src="https://unpkg.com/boxicons@2.1.4/dist/boxicons.js"></script>


</head>

<body>

    <header class="flex justify-between items-center py-4 px-15 bg-purple-600">

        <input onkeyup="procurarTarefa(event.target.value)" type="text" placeholder="pesquisar" class="w-100 h-10 pl-4 rounded bg-white"/>

        <button onclick="novaTarefa(event.target)" class="leading-10 bg-purple-800 rounded px-4 font-black text-white duration-200 hover:bg-purple-400 hover:text-black cursor-pointer">Nova tarefa</button>

    </header>

    <main class="p-15 bg-slate-200 h-screen">

        <h1 class="text-3xl font-bold mb-6">Tarefas</h1>

        <div  id="cards" class="grid grid-cols-3 gap-4">
            <!-- <div class="bg-white p-4 rounded-lg">
                <h3 class="font-bold mb-4">titulo card</h3>
                <p>Lorem ipsum dolor sit, amet consectetur adipisicing elit. Id, enim! Porro iure, repellendus fugit fuga libero dignissimos sunt eos quasi quisquam incidunt quis nesciunt inventore illum rerum ad, est cum!</p>
            </div> -->
        </div>

        <!-- INICIO CAMADA ESCURA OVERLAY -->
        <div id="escuro" onclick="fundoEscuro()" class=" opacity-0 invisible duration-200 delay-200 fixed inset-0 z-40 bg-black/60"></div>
        <!-- FIM CAMADA ESCURA OVERLAY -->

        <!-- INICIO FORMULARIO PARA EDITAR TAREFA -->
        <div id="editarTrefa" class="w-100 p-4 rounded-lg bg-purple-800 fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 opacity-0 invisible duration-200 delay-200 z-50">
            
            <div class="flex justify-between font-bold mb-2">
                <h1 class="text-white font-bold text-2xl">Editar tarefa</h1>
                <box-icon name='x' onclick="fundoEscuro()" class="cursor-pointer fill-white w-10 h-10"></box-icon>
            </div>
            
            <form onsubmit="editarTarefa()" class="flex flex-col">
                <input type="hidden" id="idEdicao">
                <label for="titulo" class="text-white uppercase text-xs font-bold mb-2 block">Titulo</label>
                <input id="tituloEditado" type="text" placeholder="Titulo da tarefa"
                    class="pl-3 h-10 border-2 bg-white border-slate-400 focus:border-purple-600 duration-150 rounded outline-none mb-4"
                    required />
                <label for="descricao" class="text-white uppercase text-xs font-bold mb-2 block">Descrição</label>
                
                <textarea
                    id="descricao"
                    class="pl-3 h-30 border-2 bg-white border-slate-400 focus:border-purple-600 duration-150 rounded outline-none mb-4"
                    required></textarea>
                <button type="submit"
                    class="cursor-pointer w-full h-10 rounded bg-purple-500 hover:bg-purple-400 duration-200 hover:text-white font-bold">Editar</button>
            </form>

        </div>
        <!-- FIM FORMULARIO PARA EDITAR TAREFA -->

        <!-- INICIO FORMULARIO PARA CRIAR TAREFA -->
        <form onsubmit="criarTarefas()" id="tarefa" class=" opacity-0 invisible duration-200 delay-200 fixed inset-0 z-50 m-auto flex flex-col gap-5 justify-center items-center p-4 rounded-lg bg-purple-800 w-120 h-100" >

            <div class="flex justify-between w-full">
                <h1 class="text-white font-bold text-2xl">Criar nova tarefa</h1>
                <box-icon name='x' class="cursor-pointer fill-white w-10 h-10" onclick="fundoEscuro()"></box-icon>
            </div>

            <input id="titulo" type="text" class=" w-100 h-10 pl-4 rounded bg-white" placeholder="Titulo da tarefa">

            <textarea id="conteudo" placeholder="sua tarefa" class="w-100 h-50 pl-4 rounded bg-white"></textarea>

            <button type="submit" class=" w-100 leading-10 bg-purple-500 rounded px-4 font-black text-white duration-200 hover:bg-purple-400 hover:text-black cursor-pointer">criar</button>
        </form>
        <!-- FIM FORMULARIO PARA CRIAR TAREFA -->
    </main>
    <script src="index.js"></script>
</body>
</html>
