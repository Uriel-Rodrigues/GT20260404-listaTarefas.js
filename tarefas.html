<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lista de tarefas</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>

<body>

    <header class="flex justify-between items-center py-4 px-15 bg-purple-600">
        <input onkeyup="procurarTarefa(event.target.value)" type="text" placeholder="pesquisar" class="w-100 h-10 pl-4 rounded bg-white"/>
        <button onclick="novaTarefa(event.target)" class="leading-10 bg-purple-800 rounded px-4 font-black text-white duration-200 hover:bg-purple-400 hover:text-black cursor-pointer">Nova tarefa</button>
    </header>

    <main class="p-15 bg-slate-200 h-screen">
        <h1 class="text-3xl font-bold mb-6">Tarefas</h1>
        <div  id="cards" class="grid grid-cols-3 gap-4">
            <!-- <div class="bg-white p-4 rounded-lg">
                <h3 class="font-bold mb-4">titulo card</h3>
                <p>Lorem ipsum dolor sit, amet consectetur adipisicing elit. Id, enim! Porro iure, repellendus fugit fuga libero dignissimos sunt eos quasi quisquam incidunt quis nesciunt inventore illum rerum ad, est cum!</p>
            </div> -->
        </div>

        <div id="escuro" onclick="fundoEscuro()" class=" hidden fixed inset-0 z-40 bg-black/60"></div>

        <form onsubmit="criarTarefas()" id="tarefa" class=" hidden fixed inset-0 z-50 m-auto flex flex-col gap-5 justify-center items-center p-4 rounded-lg bg-purple-800 w-120 h-100" >
            
            <h1 class="text-white font-bold text-2xl">Criar nova tarefa</h1>

            <input id="titulo" type="text" class=" w-100 h-10 pl-4 rounded bg-white" placeholder="Titulo da tarefa">

            <textarea id="conteudo" placeholder="sua tarefa" class="w-100 h-50 pl-4 rounded bg-white"></textarea>

            <button type="submit" class=" w-100 leading-10 bg-purple-500 rounded px-4 font-black text-white duration-200 hover:bg-purple-400 hover:text-black cursor-pointer">criar</button>
        </form>

    </main>
    <script src="index.js"></script>
</body>
</html>
