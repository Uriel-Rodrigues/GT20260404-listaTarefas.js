<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lista de tarefas</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>

<body class="bg-slate-200 h-screen flex justify-center items-center">
    <div class="bg-white shadow-lg rounded-lg p-4">
        <h1 class="font-bold text-xl mb-6">Seja bem vindo(a)!</h1>
        <form onsubmit="login()" class="flex flex-col w-80">
            <label for="email" class="uppercase text-xs font-bold mb-2 block">Email</label>
            <input id="email" type="text" placeholder="seu email" class="pl-3 h-10 border-2 border-slate-400 focus:border-purple-600 duration-150 rounded outline-none mb-4" required>
            <label for="senha" class="uppercase text-xs font-bold mb-2 block">Senha</label>
            <input id="senha" type="password" placeholder="sua senha" class="pl-3 h-10 border-2 border-slate-400 focus:border-purple-600 duration-150 rounded outline-none mb-4" required>
            <a href="/cadastrar.html" class="my-5">Cadastre-se</a>
            <button class="cursor-pointer w-full h-10 rounded bg-purple-400 hover:bg-purple-600 duration-200 hover:text-white font-bold">Logar</button>

        </form>

    </div>

    
    <script>
        function login(){
            event.preventDefault()

            let email = document.querySelector("#email").value;
            let senha = document.querySelector("#senha").value;
            
            let dados = {
                email: email,
                senha: senha
            }

            fetch("https://js-lista-de-tarefas-api.onrender.com/login", {
                method: "post",
                headers:{
                    "content-type": "application/json"
                },
                body: JSON.stringify(dados)
            })
            .then((response)=>{return response.json()})
            .then((json) => {
                if (json.tipo == "error"){
                    alert(json.mensagem);
                    return;
                }
                alert(json.mensagem);
                window.location.href = "tarefas.html"
            })
            .catch((error) => {
                alert(error.message);
            })
            

        }
    </script>
</body>
</html>
